name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify focus-runtime.js mirror
        run: ./Scripts/sync_focus_runtime.sh --check

      - name: Verify Bilibili API contract mirror
        run: ./Scripts/sync_bilibili_api_contracts.mjs --check

      - name: Verify online smoke remains opt-in
        run: node Scripts/run_online_smoke.mjs

  swift:
    name: Swift and Xcode
    needs: runtime-contract
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Set up JDK 21 for KMP iOS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Sources/**/*.js', 'Tests/**/*.swift', 'Tests/**/*.html') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run Swift package tests
        # WebKit-based policy tests launch a helper process, which SwiftPM's
        # package sandbox blocks even though the test itself is local-only.
        run: FOCUS_INCLUDE_TESTS=1 swift test --disable-sandbox

      - name: Run Swift package tests in Release
        run: FOCUS_INCLUDE_TESTS=1 swift test -c release --disable-sandbox

      - name: Run FocusVerifier
        run: swift run FocusVerifier

      - name: Compile KMP iOS simulator framework
        run: >-
          ./gradlew --no-daemon
          :focus-core:compileKotlinIosSimulatorArm64
          :focus-core:linkDebugFrameworkIosSimulatorArm64

      - name: Run Xcode unit tests
        shell: bash
        run: |
          simulator_id="$(
            xcrun simctl list devices available --json |
              ruby -rjson -e 'data = JSON.parse(STDIN.read); device = data.fetch("devices").select { |runtime, _| runtime.include?("iOS") }.values.flatten.find { |candidate| candidate.fetch("isAvailable", true) }; abort("No available iOS Simulator") unless device; puts device.fetch("udid")'
          )"
          xcodebuild test \
            -project BilibiliFocus.xcodeproj \
            -scheme BilibiliFocus \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -resultBundlePath "$RUNNER_TEMP/BilibiliFocusTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned iOS Release
        run: >-
          xcodebuild build
          -project BilibiliFocus.xcodeproj
          -scheme BilibiliFocus
          -configuration Release
          -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Upload Xcode result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BilibiliFocusTests-xcresult
          path: ${{ runner.temp }}/BilibiliFocusTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android and KMP
    needs: runtime-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test and build Android
        run: >-
          ./gradlew --no-daemon
          verifyFocusRuntimeSync
          :focus-core:testDebugUnitTest
          :focus-android:testDebugUnitTest
          :focus-android:lintDebug
          :focus-android:assembleDebug
          :focus-android:compileReleaseKotlin

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-and-lint-reports
          path: |
            focus-core/build/reports/tests
            focus-android/build/reports/tests
            focus-android/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7
